<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>随笔与摄影日志 | Blog</title>

<!-- 加载主题 neon 皮肤，和主页保持一致 -->
<link rel="stylesheet" href="/assets/css/main.css">

<style>
/* NEON 深色主题样式 */
body {
  max-width:700px;
  margin:30px auto;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:#121212 !important;
  color:#e0e0e0 !important;
  line-height:1.6;
}

.back-home {
  position:fixed;
  top:20px;
  left:20px;
  padding:6px 12px;
  background:#1e1e1e !important;
  color:#4dd3ff !important;
  border-radius:8px;
  border: 1px solid #333;
  text-decoration:none;
  font-size:14px;
}
.back-home:hover {
  border-color:#4dd3ff;
  box-shadow:0 0 10px #4dd3ff;
}

.post {
  background:#1e1e1e !important;
  color:#e0e0e0 !important;
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
  border: 1px solid #333;
}
.post-title {
  font-size:18px;
  margin:0 0 8px;
}
.post-title a {
  color:#4dd3ff !important;
  text-decoration:none;
}
.post-title a:hover {
  text-shadow:0 0 8px #4dd3ff;
}
.post-date {
  color:#aaa !important;
  font-size:13px;
}
.post-excerpt {
  margin-top:10px;
  color:#ccc !important;
  font-size:14px;
}
h1 {
  font-size:22px;
  font-weight:500;
  margin-bottom:20px;
  color:#4dd3ff;
  text-shadow:0 0 10px #4dd3ff;
}
</style>
</head>

<body>

<a href="/" class="back-home">← 返回首页</a>
<h1>随笔与摄影日志 / Blog</h1>

{% for post in site.posts %}
<div class="post">
  <h2 class="post-title"><a href="{{ post.url }}">{{ post.title }}</a></h2>
  <div class="post-date">{{ post.date | date: "%Y-%m-%d" }}</div>
  <div class="post-excerpt">{{ post.excerpt | strip_html | truncate: 80 }}</div>
</div>
{% endfor %}

</body>
</html>
