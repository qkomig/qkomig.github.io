<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的碎碎念 | Memos</title>

<!-- 加载主题 neon 皮肤 CSS（这一行让它和主页统一！） -->
<link rel="stylesheet" href="/assets/css/main.css">

<style>
/* NEON 深色主题样式 */
body {
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
  font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background: #121212 !important; /* neon 黑底 */
  color: #e0e0e0 !important;
  line-height: 1.6;
}
.memo {
  background: #1e1e1e !important;
  color: #e0e0e0 !important;
  padding: 15px 20px;
  border-radius: 12px;
  margin-bottom: 12px;
  border: 1px solid #333;
}
.time {
  color: #aaa !important;
  font-size: 12px;
  margin-bottom: 5px;
}
.content {
  font-size: 15px;
}
h1 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 20px;
  color: #4dd3ff; /* neon 蓝色 */
  text-shadow: 0 0 10px #4dd3ff;
}

/* 返回首页按钮 - 深色版 */
.back-home {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 6px 12px;
  background: #1e1e1e !important;
  color: #4dd3ff !important;
  border-radius: 8px;
  border: 1px solid #444;
  text-decoration: none;
  font-size: 14px;
}
.back-home:hover {
  border-color: #4dd3ff;
  box-shadow: 0 0 10px #4dd3ff;
}
</style>
</head>

<body>

<a href="/" class="back-home">← 返回首页</a>

<h1>我的碎碎念 / Memos</h1>

{% for memo in site.memos %}
<div class="memo">
<div class="time">{{ memo.date | date: "%Y-%m-%d %H:%M" }}</div>
<div class="content">{{ memo.content | markdownify }}</div>
</div>
{% endfor %}

</body>
</html>
