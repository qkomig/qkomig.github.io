# 站点基础
title: "guchizi"          # 改成你想要的站点名
description: "摄影与随笔" # 改成你的站点描述
url: "https://guchizi.ccwu.cc"
baseurl: ""               # 这里留空，因为你的站点在根目录

# 核心：Minimal Mistakes 主题
remote_theme: mmistakes/minimal-mistakes

# 开启必要插件
plugins:
  - jekyll-include-cache

# 基础布局配置
defaults:
  - scope:
      path: ""
    values:
      layout: single      # 默认用单栏布局，适配博客/摄影

# 导航栏配置（可选，先留空也能跑）
header:
  title: "guchizi"
