# --------------------------
# 站点基础信息
# --------------------------
title: "guchizi"
description: "另一种赛博永生"
url: "https://guchizi.ccwu.cc"
baseurl: ""
locale: "zh-CN"

# --------------------------
# 主题与皮肤配置（关键）
# --------------------------
# 锁定包含 neon 皮肤的最新版本主题
remote_theme: mmistakes/minimal-mistakes@4.26.2
# 启用 neon 深色皮肤（唯一正确写法）
minimal_mistakes_skin: neon

# --------------------------
# 插件配置（精简，避免冲突）
# --------------------------
plugins:
  - jekyll-include-cache

# --------------------------
# Memos 碎碎念配置
# --------------------------
collections:
  memos:
    output: true
    permalink: /:collection/:path/

# --------------------------
# 导航栏配置
# --------------------------
header:
  nav:
    - title: "随笔日志 / Blog"
      url: /posts/
    - title: "摄影影集 / Gallery"
      url: /gallery/
    - title: "碎碎念 / Memos"
      url: /memos/
