# 站点基础信息
title: "guchizi"
description: "另一种赛博永生"
url: "https://guchizi.ccwu.cc"
baseurl: ""
locale: "zh-CN"

# 主题与深色皮肤配置（关键部分！）
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "neon" # 生效的正确写法！
dark_mode: true # 强制深色模式
color_theme: dark # 适配深色主题的配色

# 必须开启的插件
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Memos 碎碎念配置
collections:
  memos:
    output: true
    permalink: /:collection/:path/

# 导航栏配置（适配深色主题）
header:
  nav:
    - title: "随笔日志 / Blog"
      url: /posts/
    - title: "摄影影集 / Gallery"
      url: /gallery/
    - title: "碎碎念 / Memos"
      url: /memos/
