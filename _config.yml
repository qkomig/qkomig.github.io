# 网站标题
title: "guchizi"

# 网站描述（你的专属文案！）
description: "另一种赛博永生"

# 你的域名
url: "https://guchizi.ccwu.cc"

# 根目录（留空）
baseurl: ""

# 使用的主题
remote_theme: mmistakes/minimal-mistakes

# 主题皮肤（护眼深色模式）
skin: neon

# 必须开启的插件
plugins:
  - jekyll-include-cache

# ==============================================
# Memos 碎碎念功能专用配置
# 作用：让 GitHub Pages 识别 _memos 文件夹里的内容
# ==============================================
collections:
  memos:
    output: true    # 开启 memos 功能（必须开启）
