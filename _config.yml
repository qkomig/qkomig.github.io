title: "guchizi"
description: "另一种赛博永生"
url: "https://guchizi.ccwu.cc"
baseurl: ""
locale: "zh-CN"

# 锁定新版 + 强制 Neon 皮肤（唯一生效写法）
remote_theme: mmistakes/minimal-mistakes@4.26.2
minimal_mistakes_skin: neon

# 插件
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

collections:
  memos:
    output: true
    permalink: /:collection/:path/

header:
  nav:
    - title: "随笔日志 / Blog"
      url: /posts/
    - title: "摄影影集 / Gallery"
      url: /gallery/
    - title: "碎碎念 / Memos"
      url: /memos/

# 关键！强制全站深色模式，无视系统设置
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      dark_mode: true
